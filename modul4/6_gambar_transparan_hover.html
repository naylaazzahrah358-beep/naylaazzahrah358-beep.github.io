<!DOCTYPE html>
<html>
<head>
    <title>Mengatur Gambar Transparan dengan Hover</title>
    <style>
        img {
            opacity: 0.4;
            filter: alpha(opacity=40); /* For IE8 and earlier */
        }
        img:hover {
            opacity: 1.0;
            filter: alpha(opacity=100); /* For IE8 and earlier */
        }
    </style>
</head>
<body>
    <h1>Image Transparency</h1>
    <img src="gambar1.jpg" width="150" height="113" alt="gambar1">
    <img src="gambar3.jpg" width="150" height="113" alt="gambar3">
    <p><b>Note:</b> In IE, a !DOCTYPE must be added for the :hover selector to work on other elements than the a element.</p>
</body>
</html>
