<!DOCTYPE html>
<html>
<head>
    <title>contoh css float 3 kolom</title>
    <style type="text/css">
        body {
            background-color: pink;
            width: 1000px;
            margin: auto;
        }
        h2 {
            padding-left: 10px;
        }
        #sidebar-kiri {
            min-height: 500px; /* tinggi minimal */
            float: left; /* menekan ke kiri */
            width: 300px; /* lebar */
            margin: 5px;
            background-color: white;
        }
        #sidebar-tengah-atau-badan {
            min-height: 500px; /* tinggi minimal */
            float: left; /* menekan ke kiri */
            width: 350px; /* lebar */
            margin: 5px;
            background-color: white;
        }
        #sidebar-kanan {
            min-height: 500px; /* tinggi minimal */
            float: left; /* menekan ke kiri */
            width: 300px; /* lebar */
            margin: 5px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="sidebar-kiri">
        <h2>sidebar kiri</h2>
    </div>
    <div id="sidebar-tengah-atau-badan">
        <h2>sidebar tengah</h2>
    </div>
    <div id="sidebar-kanan">
        <h2>sidebar kanan</h2>
    </div>
</body>
</html>
