<!DOCTYPE html>
<html>
<head>
    <title>contoh css float 2 kolom</title>
    <style type="text/css">
        body {
            margin: 0;
            font-family: Verdana, Arial, sans-serif;
        }
        #wrapper {
            background-color: #e8b9e8;
            color: #000066;
        }
        #leftcolumn {
            float: left;
            width: 100px;
        }
        #rightcolumn {
            margin-left: 100px;
            background-color: #ffffff;
            color: #000000;
        }
        #logo {
            background-color: #eeeeee;
            color: #cc66cc;
            font-size: x-large;
            border-bottom: 1px solid #000000;
            padding: 10px;
        }
        .content {
            padding: 20px 20px 0 20px;
        }
        #floatright {
            margin: 10px;
            float: right;
        }
        .footer {
            font-size: xx-small;
            text-align: center;
            clear: right;
            padding-bottom: 20px;
        }
        .navBar {
            text-decoration: none;
            margin: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="leftcolumn">
            <span class="navBar">navBar</span>
        </div>
        <div id="rightcolumn">
            <div id="logo">Logo</div>
            <div class="content">Content</div>
            <div id="floatright">FloatRight</div>
            <div class="footer">Footer</div>
        </div>
    </div>
</body>
</html>
