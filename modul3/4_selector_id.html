<html>
<head>
    <title>Selector ID</title>
    <style type="text/css">
        #tampil1 {
            position: absolute;
            left: 100px;
            top: 75px;
            z-index: 2;
        }
        #tampil2 {
            position: absolute;
            left: 130px;
            top: 120px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="tampil1">
        <table border="1" bgcolor="cyan">
            <tr>
                <td>Ini adalah tampil 1<br>Diletakkan pada posisi (50,100)</td>
            </tr>
        </table>
    </div>
    <div id="tampil2">
        <table border="1" bgcolor="yellow">
            <tr>
                <td>Ini adalah tampil 2<br>Diletakkan pada posisi (10,120)</td>
            </tr>
        </table>
    </div>
</body>
</html>
